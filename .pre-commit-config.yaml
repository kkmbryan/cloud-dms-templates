# pre-commit hooks (https://pre-commit.com). Install once: pre-commit install
# Run on everything: pre-commit run --all-files
# Needs terraform, tflint, trivy and python3 on PATH. Revisions are frozen to
# commit SHAs (tag in the comment); update with: pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 4c4437d784e93cacb1f05f1d7bc28e4354fafd20 # frozen: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args:
          - --severity=warning

  - repo: local
    hooks:
      - id: zh-parity
        name: EN <-> zh-CN Markdown parity
        entry: python3 scripts/ci/zh_parity_check.py
        language: system
        files: \.md$
        pass_filenames: false
      - id: customer-safety
        name: Customer-safety check
        entry: bash scripts/ci/customer_safety_check.sh
        language: system
        pass_filenames: false
      - id: terraform-test
        name: terraform test (mocked, plan-only)
        entry: bash -c 'set -e; for d in templates/*/ examples/*/; do [ -d "$d/tests" ] || continue; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform test); done'
        language: system
        files: \.(tf|tftest\.hcl)$
        pass_filenames: false
